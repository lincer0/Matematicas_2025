<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Matemáticas</title>
    <link rel="icon" type="image/x-icon" href="favicons.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- MathJax CDN for rendering math formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>
    <header>
        <h1>Flashcards de Matemáticas</h1>
    </header>

    <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">Todas</button>
        <button class="filter-btn" data-category="aritmetica">Aritmética</button>
        <button class="filter-btn" data-category="geometria">Geometría</button>
        <button class="filter-btn" data-category="estadistica">Estadística</button>
    </div>

    <div class="flashcards-container">
        <!-- Flashcards will be inserted here by JavaScript -->
    </div>

    <script src="script.js"></script>
</body>
</html>
